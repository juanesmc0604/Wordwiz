<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Perfil - WordWiz</title>
  <link rel="stylesheet" href="css/perfil.css" />
</head>
<body>
  <header class="app-header">
    Wordwiz - Aprende Idiomas con Magia
  </header>

  <main class="profile-container">
    <div class="avatar">
      <img src="./assets/imagen/perfilmago.png" alt="Wordwiz">
    </div>
    <h2 id="name"></h2>
    <p class="username"></p>
    <p class="join-date"></p>

    <div class="stats">
      <div class="stat">
        <strong id="streak">0</strong><br>Días en racha
      </div>
      <div class="stat">
        <strong id="exp">0</strong><br>Puntos
      </div>
      <div class="stat">
        <strong id="words">0</strong><br>Palabras
      </div>
    </div>

    <section class="medals">
      <h3>🎖️ Medallas</h3>
      <div class="medal-list" id="medals"></div>
    </section>

  </main>

    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="nav-item" data-section="profile">
            <a href="perfil.html"><img src="./assets/imagen/perfilmago.png" width="32" alt="Perfil"></a><br>
            Perfil
        </div>
        <div class="nav-item" data-section="lessons">
            <a href="lecciones.html"><img src="./assets/imagen/WhatsApp Image 2025-09-09 at 5.41.51 PM (1).jpeg" width="32" alt="Lecciones" style="border-radius: 50%; object-fit: cover;"></a><br>
            Lecciones
        </div>
        <div class="nav-item" data-section="progress">
            <a href="index.html"><img src="./assets/imagen/WhatsApp Image 2025-09-09 at 5.41.51 PM.jpeg" width="32" alt="Progreso" style="border-radius: 50%; object-fit: cover;"></a><br>
            Progreso
        </div>
    </nav>

  <script src="scripts/perfil.js"></script>
</body>
</html>
